  <style>
    :root {
      --bg: #121417;
      --card-bg: #1c1f26;
      --card-border: #2e3440;
      --accent: #007acc;
      --accent-hover: #005f9e;
      --text: #f0f3f6;
      --text-muted: #8b949e;
      --error: #ff5555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      animation: fadeIn 0.3s ease-out;
    }
    .icon-lock {
      width: 56px;
      height: 56px;
      background: rgba(0, 122, 204, 0.15);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--accent);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      font-weight: 600;
    }
    p.desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .input-wrapper {
      position: relative;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: #121417;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.25);
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }
    .toggle-pwd:hover {
      color: var(--text);
    }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    button.btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button.btn-submit:hover {
      background: var(--accent-hover);
    }
    button.btn-submit:active {
      transform: scale(0.98);
    }
    .error-msg {
      margin-top: 16px;
      color: var(--error);
      font-size: 0.9rem;
      display: none;
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .loader {
      display: none;
      margin: 12px auto 0;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-card" id="card">
    <div class="icon-lock">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1>Доступ ограничен</h1>
    <p class="desc">Для открытия инструмента введите код доступа</p>

    <form id="authForm" onsubmit="handleUnlock(event)">
      <div class="form-group">
        <div class="input-wrapper">
          <input type="password" id="pinInput" placeholder="Код доступа" inputmode="numeric" autocomplete="current-password" autofocus required>
          <button type="button" class="toggle-pwd" id="toggleBtn" onclick="toggleVisibility()" title="Показать/скрыть код">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <label class="remember-row">
        <input type="checkbox" id="rememberCheck" checked>
        <span>Запомнить на этом устройстве</span>
      </label>

      <button type="submit" class="btn-submit" id="submitBtn">Открыть инструмент</button>
      <div class="loader" id="loader"></div>
      <div class="error-msg" id="errorMsg">Неверный код доступа</div>
    </form>
  </div>

    const STORAGE_KEY = 'calcs_access_pin_cache';

    function base64ToU8(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        arr[i] = bin.charCodeAt(i);
      }
      return arr;
    }

    async function decryptPayload(password) {
      const salt = base64ToU8(ENCRYPTED_PAYLOAD.salt);
      const iv = base64ToU8(ENCRYPTED_PAYLOAD.iv);
      const data = base64ToU8(ENCRYPTED_PAYLOAD.data);

      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const aesKey = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: 100000,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        aesKey,
        data
      );

      const dec = new TextDecoder('utf-8');
      return dec.decode(decrypted);
    }

    function toggleVisibility() {
      const input = document.getElementById('pinInput');
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
    }

    async function tryUnlock(pin, isAuto = false) {
      const card = document.getElementById('card');
      const errorMsg = document.getElementById('errorMsg');
      const loader = document.getElementById('loader');
      const submitBtn = document.getElementById('submitBtn');

      errorMsg.style.display = 'none';
      loader.style.display = 'block';
      submitBtn.style.display = 'none';

      try {
        const html = await decryptPayload(pin);
        if (document.getElementById('rememberCheck').checked) {
          try { localStorage.setItem(STORAGE_KEY, pin); } catch(e){}
        }
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        loader.style.display = 'none';
        submitBtn.style.display = 'block';
        if (!isAuto) {
          errorMsg.style.display = 'block';
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
        } else {
          try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
        }
      }
    }

    function handleUnlock(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      if (pin) {
        tryUnlock(pin, false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          document.getElementById('pinInput').value = saved;
          tryUnlock(saved, true);
        }
      } catch(e){}
    });
  </script>
